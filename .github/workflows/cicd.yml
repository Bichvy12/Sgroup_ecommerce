name: CICD-Backend Ecommerce
on: 
  push:
    branches:
      - main
jobs:
  ci:
    name: CI- code validation
    runs-on: ubuntu-latest
    steps:
      - name: Pull source code from github
        uses: actions/checkout@v4
      - name: Set up environment nodejs
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: |
          npm ci
      - name: Verify syntax
        run: |
          node --check src/index.js
          echo "OK"
  build-and-pushDI:
    name: CD - Build and push Docker Image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Pull source code from github
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Build image and push on Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{secrets.DOCKERHUB_USERNAME}}/ecommerce:latest
            ${{secrets.DOCKERHUB_USERNAME}}/ecommerce:${{github.sha}}
  deploy-ec2:
    name: CD - Deploy to EC2 via ssh
    needs: build-and-pushDI
    runs-on: ubuntu-latest
    steps:
      - name: Connect ssh to EC2 and update container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_SSH_KEY}}
          port: 22
          script: |
            echo "[CI/CD] Start update new version on EC2"
            cd ~/app
            docker compose pull backend
            docker compose up -d --no-deps backend
            docker image prune -f
            docker compose ps
            echo "[CI/CD] Implement successfully"

